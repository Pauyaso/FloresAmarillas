<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flores amarillas para Gianella 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #07060a;
    --gold: #ffd23f;
    --petal: #ffb703;
    --leaf: #3a7d44;
    --cream: #fff8e1;
    --ink: #3b2a05;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"], :root[data-theme="dark"] { --night: #07060a; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--night);
    color: var(--cream);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .phrase {
    position: absolute;
    font-family: "Caveat", "Segoe Script", cursive;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(255, 210, 63, .7);
    white-space: nowrap;
    opacity: 0;
    animation: drift var(--dur, 9s) ease-in-out forwards;
  }
  .flower {
    position: absolute;
    opacity: 0;
    filter: drop-shadow(0 0 10px rgba(255, 190, 0, .55));
    animation: drift var(--dur, 10s) ease-in-out forwards;
  }
  @keyframes drift {
    0%   { opacity: 0; transform: translateY(20px) scale(.6) rotate(var(--r0, 0deg)); }
    15%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-60px) scale(1) rotate(var(--r1, 0deg)); }
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    font-size: 15px;
    color: rgba(255, 248, 225, .75);
    background: rgba(255, 210, 63, .12);
    border: 1px solid rgba(255, 210, 63, .35);
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .6s;
    white-space: nowrap;
  }
  #hint:focus-visible, .card button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .veil {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding: 20px;
    background: rgba(7, 6, 10, .55);
    opacity: 0; pointer-events: none;
    transition: opacity .7s ease;
  }
  .veil.open { opacity: 1; pointer-events: auto; }
  .card {
    width: min(360px, 100%);
    background: var(--cream);
    color: var(--ink);
    border-radius: 22px 22px 22px 6px;
    padding: 28px 24px 22px;
    text-align: center;
    box-shadow: 0 0 60px rgba(255, 190, 0, .45);
    transform: translateY(30px) rotate(-2deg) scale(.92);
    transition: transform .8s cubic-bezier(.2, .9, .3, 1.2);
    position: relative;
  }
  .veil.open .card { transform: translateY(0) rotate(-1deg) scale(1); }
  .card .bloom { font-size: 64px; line-height: 1; margin-top: -60px; }
  .card h1 {
    font-family: "Caveat", "Segoe Script", cursive;
    font-size: 44px; line-height: 1.05; margin: 10px 0 8px; color: #c77d00;
  }
  .card p { font-size: 17px; line-height: 1.55; margin: 0 0 12px; }
  .card .sign { font-family: "Caveat", cursive; font-size: 26px; margin: 4px 0 16px; }
  .card button {
    font-family: inherit; font-weight: 700; font-size: 15px;
    background: var(--gold); color: var(--ink);
    border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer;
  }
  .photo {
    position: absolute;
    width: var(--w, 110px);
    padding: 6px 6px 18px;
    background: var(--cream);
    border-radius: 4px;
    box-shadow: 0 0 24px rgba(255, 200, 40, .55);
    opacity: 0;
    animation: drift var(--dur, 12s) ease-in-out forwards;
  }
  .photo img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 2px; }
  .pop {
    position: fixed;
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: pop 1.4s ease-out forwards;
    filter: drop-shadow(0 0 10px rgba(255, 190, 0, .7));
  }
  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-30deg); }
    25%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, -140%) scale(1) rotate(15deg); }
  }
  #sound {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: 14px;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255, 210, 63, .35);
    background: rgba(255, 210, 63, .12);
    color: var(--cream);
    font-size: 18px;
    cursor: pointer;
    display: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .phrase, .flower, .photo, .pop { animation-duration: 0.01s !important; }
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="floaters" aria-hidden="true"></div>
<button id="sound" type="button" aria-label="Silenciar música">🔊</button>
<button id="hint" type="button" style="display:none">Toca para abrir tu mensaje 💛</button>

<div class="veil open" id="veil" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="card">
    <div class="bloom" aria-hidden="true">🌻</div>
    <h1 id="cardTitle">Para ti, Gianella 💛</h1>
    <p id="msg">Como sé que lo tuyo no es cuidar flores, te regalo estas, que no se marchitan. Para que sepas que cada día a tu lado brilla un poquito más.</p>
    <div class="sign" id="sign"></div>
    <button type="button" id="close">Ver las flores otra vez</button>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN — cambia aquí lo que quieras
   ========================================================= */
const CONFIG = {
  // Carpeta de fotos: sube tus imágenes a assets/fotos/ y aparecerán solas,
  // con cualquier nombre (jpg, jpeg, png, webp o gif).
  carpetaFotos: "assets/fotos",
  // Canción opcional (mp3). Empieza al tocar el botón, porque el iPhone
  // no deja poner música sola. Déjalo en "" si no quieres música.
  cancion: "assets/cancion.mp3",
  // Frases que flotan
  frases: ["Te quiero", "Eres mi sol ☀️", "Mi amor", "Siempre juntos", "Me encantas",
           "Eres preciosa", "Mi flor favorita", "Contigo todo brilla", "Te adoro"],
};

(() => {
  // Personalización por enlace: ?para=Lucía&de=Carlos
  const q = new URLSearchParams(location.search);
  const para = (q.get("para") || "Gianella").trim().slice(0, 30);
  const de = (q.get("de") || "").trim().slice(0, 30);
  if (para) document.getElementById("cardTitle").textContent = `Para ti, ${para} 💛`;
  if (de) document.getElementById("sign").textContent = `— ${de}`;

  const phrases = CONFIG.frases.slice();
  if (para) phrases.push(para + " 💛");

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cv = document.getElementById("sky");
  const ctx = cv.getContext("2d");
  let W, H, dpr, t = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildHeart();
    if (reduce) { ctx.fillStyle = "#07060a"; ctx.fillRect(0, 0, W, H); draw(); }
  }

  // Polvo dorado que gira en espiral
  const dust = Array.from({ length: 420 }, () => ({
    a: Math.random() * Math.PI * 2,
    r: Math.pow(Math.random(), .6),
    s: .002 + Math.random() * .006,
    z: .4 + Math.random() * 1.6,
    tw: Math.random() * Math.PI * 2
  }));

  // Partículas que forman el corazón
  let heart = [];
  function buildHeart() {
    const scale = Math.min(W, H) / 38;
    const cx = W / 2, cy = H * .36;
    heart = [];
    for (let i = 0; i < 260; i++) {
      const k = (i / 260) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(k), 3);
      const y = -(13 * Math.cos(k) - 5 * Math.cos(2 * k) - 2 * Math.cos(3 * k) - Math.cos(4 * k));
      heart.push({
        tx: cx + x * scale, ty: cy + y * scale,
        x: reduce ? cx + x * scale : W / 2 + (Math.random() - .5) * W,
        y: reduce ? cy + y * scale : H * .65 + (Math.random() - .5) * 40,
        z: .6 + Math.random() * 1.4, tw: Math.random() * 6
      });
    }
  }

  function draw() {
    t++;
    ctx.fillStyle = "rgba(7, 6, 10, 0.28)";
    ctx.fillRect(0, 0, W, H);

    // Resplandor central
    const cx = W / 2, cy = H * .65;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * .45);
    g.addColorStop(0, "rgba(255, 220, 90, 0.20)");
    g.addColorStop(1, "rgba(255, 220, 90, 0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Galaxia de polvo
    const R = Math.max(W, H) * .6;
    for (const p of dust) {
      p.a += reduce ? 0 : p.s;
      const x = cx + Math.cos(p.a) * p.r * R;
      const y = cy + Math.sin(p.a) * p.r * R * .28;
      const alpha = .35 + .65 * Math.abs(Math.sin(t * .03 + p.tw));
      ctx.fillStyle = `rgba(255, ${200 + (p.z * 20 | 0)}, 60, ${alpha})`;
      ctx.beginPath(); ctx.arc(x, y, p.z, 0, 7); ctx.fill();
    }

    // Corazón que se va formando
    const pull = Math.min(1, t / 240);
    const beat = 1 + Math.sin(t * .06) * .025;
    for (const p of heart) {
      const tx = W / 2 + (p.tx - W / 2) * beat, ty = H * .36 + (p.ty - H * .36) * beat;
      p.x += (tx - p.x) * .04 * pull;
      p.y += (ty - p.y) * .04 * pull;
      const alpha = .5 + .5 * Math.sin(t * .05 + p.tw);
      ctx.fillStyle = `rgba(255, 215, 80, ${alpha})`;
      ctx.shadowColor = "rgba(255, 200, 40, .9)"; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.z, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0;

    if (!reduce) requestAnimationFrame(draw);
  }

  const layer = document.getElementById("floaters");
  function spawn(cls, text, size) {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    el.style.left = (4 + Math.random() * (cls === "phrase" ? 52 : 82)) + "%";
    el.style.top = (15 + Math.random() * 72) + "%";
    el.style.fontSize = size + "px";
    el.style.setProperty("--dur", (7 + Math.random() * 5) + "s");
    el.style.setProperty("--r0", (Math.random() * 30 - 15) + "deg");
    el.style.setProperty("--r1", (Math.random() * 30 - 15) + "deg");
    layer.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
  const blooms = ["🌻", "🌼", "💐", "🌻", "🌼"];
  setInterval(() => spawn("flower", blooms[Math.random() * blooms.length | 0], 26 + Math.random() * 30), 700);
  setInterval(() => spawn("phrase", phrases[Math.random() * phrases.length | 0], 20 + Math.random() * 14), 1300);

  // Fotos: se leen solas de la carpeta
  const fotos = [];
  const esImagen = n => /\.(jpe?g|png|webp|gif)$/i.test(n);
  function probar(src) {
    return new Promise(ok => {
      const im = new Image();
      im.onload = () => { fotos.push(src); ok(true); };
      im.onerror = () => ok(false);
      im.src = src;
    });
  }
  async function cargarFotos() {
    const carpeta = CONFIG.carpetaFotos.replace(/\/$/, "");
    // 1) En GitHub Pages: pedimos a GitHub la lista de archivos de la carpeta
    const host = location.hostname;
    if (host.endsWith(".github.io")) {
      const usuario = host.split(".")[0];
      const primera = location.pathname.split("/").filter(Boolean)[0];
      const repo = primera && !primera.includes(".") ? primera : host;
      try {
        const r = await fetch(`https://api.github.com/repos/${usuario}/${repo}/contents/${carpeta}`);
        if (r.ok) {
          const lista = (await r.json()).filter(f => f.type === "file" && esImagen(f.name));
          lista.sort(() => Math.random() - .5);
          lista.forEach(f => probar(`${carpeta}/${encodeURIComponent(f.name)}`));
          if (lista.length) return;
        }
      } catch (e) {}
    }
    // 2) Plan B (otros sitios o sin conexión con GitHub): foto1.jpg, foto2.jpg...
    for (let i = 1; i <= 40; i++) {
      let ok = false;
      for (const ext of ["jpg", "jpeg", "png", "webp"]) {
        if (await probar(`${carpeta}/foto${i}.${ext}`)) { ok = true; break; }
      }
      if (!ok) break;
    }
  }
  cargarFotos();
  let fotoIdx = 0;
  function spawnPhoto() {
    if (!fotos.length) return;
    const el = document.createElement("div");
    el.className = "photo";
    const img = document.createElement("img");
    img.src = fotos[fotoIdx++ % fotos.length];
    img.alt = "";
    el.appendChild(img);
    el.style.left = (4 + Math.random() * 56) + "%";
    el.style.top = (12 + Math.random() * 60) + "%";
    el.style.setProperty("--w", (90 + Math.random() * 40) + "px");
    el.style.setProperty("--dur", (10 + Math.random() * 4) + "s");
    el.style.setProperty("--r0", (Math.random() * 24 - 12) + "deg");
    el.style.setProperty("--r1", (Math.random() * 24 - 12) + "deg");
    layer.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
  setTimeout(spawnPhoto, 2500);
  setInterval(spawnPhoto, 4200);

  // Música
  const sound = document.getElementById("sound");
  let audio = null;
  if (CONFIG.cancion) {
    audio = new Audio(CONFIG.cancion);
    audio.loop = true;
    audio.preload = "auto";
  }
  function startMusic() {
    if (!audio || !audio.paused) return;
    audio.play().then(() => { sound.style.display = "block"; }).catch(() => {});
  }
  sound.addEventListener("click", e => {
    e.stopPropagation();
    if (audio.paused) { audio.play(); sound.textContent = "🔊"; sound.setAttribute("aria-label", "Silenciar música"); }
    else { audio.pause(); sound.textContent = "🔇"; sound.setAttribute("aria-label", "Poner música"); }
  });

  // Al tocar la pantalla brota una flor
  addEventListener("pointerdown", e => {
    if (e.target.closest(".card, #sound")) return;
    startMusic();
    const f = document.createElement("div");
    f.className = "pop";
    f.textContent = blooms[Math.random() * blooms.length | 0];
    f.style.left = e.clientX + "px";
    f.style.top = e.clientY + "px";
    f.style.fontSize = (34 + Math.random() * 20) + "px";
    document.body.appendChild(f);
    f.addEventListener("animationend", () => f.remove());
  });

  const veil = document.getElementById("veil");
  const hint = document.getElementById("hint");
  veil.classList.remove("open");
  hint.style.display = "";
  function openCard() { veil.classList.add("open"); hint.style.opacity = 0; document.getElementById("close").focus(); }
  function closeCard() { veil.classList.remove("open"); hint.style.opacity = 1; }
  hint.addEventListener("click", openCard);
  document.getElementById("close").addEventListener("click", closeCard);
  setTimeout(() => { if (!veil.classList.contains("open")) openCard(); }, 11000);

  addEventListener("resize", resize);
  resize();
  if (!reduce) { ctx.fillStyle = "#07060a"; ctx.fillRect(0, 0, W, H); draw(); }
})();
</script>
</body>
</html>
